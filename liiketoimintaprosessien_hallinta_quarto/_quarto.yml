project:
  type: book

book:
  title: "Liiketoimintaprosessit -- hallinta, mallintaminen, tietojärjestelmät ja automaatio"
  author: "Ville Seppänen"
  date: "11/18/2026"
  chapters:
    - index.qmd
    - johdanto.qmd
    - prosessit_ja_liiketoimintaprosessit.qmd
    - prosessitiedon_keraaminen.qmd
    - prosessiorganisaatio_ja_prosessien_kehittaminen.qmd
    - prosessiarkkitehtuuri.qmd
    - bpmn_ja_prosessien_kuvaaminen.qmd
    - prosessiautomaatio.qmd
    - tehtavat.qmd
    - tyovalineita.qmd
    - references.qmd

bibliography: references.bib

# Kieli ja viittaukset
lang: fi

